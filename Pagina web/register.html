<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi Portafolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Crear Cuenta</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="registerName" name="nombre" required>
                </div>
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="registerEmail" name="email" required>
                </div>
                <div class="input-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="registerUsername" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="registerPassword" name="password" required>
                    <div class="password-strength">
                        <span id="passwordStrengthText">Seguridad: </span>
                        <span id="passwordStrengthBar"></span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="registerConfirmPassword" name="confirm-password" required>
                    <div id="passwordMatch" class="error-message"></div>
                </div>
                <div class="terms">
                    <label>
                        <input type="checkbox" id="acceptTerms" required>
                        Acepto los <a href="#">términos y condiciones</a>
                    </label>
                </div>
                <button type="submit" class="login-btn">Registrarse</button>
                <div id="registerMessage" class="error-message"></div>
                <p class="register-link">¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Mostrar fortaleza de contraseña
        document.getElementById('registerPassword').addEventListener('input', function() {
            const password = this.value;
            const strengthText = document.getElementById('passwordStrengthText');
            const strengthBar = document.getElementById('passwordStrengthBar');
            
            let strength = 0;
            let color = 'red';
            
            // Verificar longitud
            if (password.length >= 8) strength += 1;
            if (password.length >= 12) strength += 1;
            
            // Verificar caracteres especiales
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            
            // Determinar color y texto
            switch(strength) {
                case 0:
                case 1:
                    strengthText.textContent = "Débil";
                    color = "red";
                    break;
                case 2:
                case 3:
                    strengthText.textContent = "Moderada";
                    color = "orange";
                    break;
                case 4:
                    strengthText.textContent = "Fuerte";
                    color = "green";
                    break;
                case 5:
                    strengthText.textContent = "Muy fuerte";
                    color = "darkgreen";
                    break;
            }
            
            strengthBar.textContent = "■".repeat(strength);
            strengthBar.style.color = color;
        });
        
        // Verificar coincidencia de contraseñas
        document.getElementById('registerConfirmPassword').addEventListener('input', function() {
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = this.value;
            const message = document.getElementById('passwordMatch');
            
            if (confirmPassword && password !== confirmPassword) {
                message.textContent = "Las contraseñas no coinciden";
            } else {
                message.textContent = "";
            }
        });
    </script>
</body>
</html>
