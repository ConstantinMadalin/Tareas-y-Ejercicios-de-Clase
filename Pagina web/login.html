<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mi Portafolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuario o Email</label>
                    <input type="text" id="loginUsername" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="loginPassword" name="password" required>
                    <div class="password-actions">
                        <label>
                            <input type="checkbox" id="showPassword"> Mostrar contraseña
                        </label>
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
                <button type="submit" class="login-btn">Ingresar</button>
                <div id="loginMessage" class="error-message"></div>
                <p class="register-link">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Mostrar/ocultar contraseña
        document.getElementById('showPassword').addEventListener('change', function() {
            const passwordField = document.getElementById('loginPassword');
            passwordField.type = this.checked ? 'text' : 'password';
        });
    </script>
</body>
</html>
