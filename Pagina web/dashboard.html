<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Portafolio</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
        }
        
        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 60px);
        }
        
        .sidebar {
            width: 250px;
            background-color: #34495e;
            color: white;
            padding: 20px;
        }
        
        .sidebar ul {
            list-style: none;
        }
        
        .sidebar li {
            margin-bottom: 15px;
        }
        
        .sidebar a {
            color: white;
            display: block;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .sidebar a:hover {
            background-color: #3d566e;
        }
        
        .main-content {
            flex: 1;
            padding: 30px;
            background-color: #f5f5f5;
        }
        
        .welcome-message {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 20px;
            border: 3px solid #3498db;
        }
        
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="dashboard-header">
        <div class="container">
            <h1>Mi Panel</h1>
        </div>
    </header>
    
    <div class="dashboard-container">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#">Resumen</a></li>
                    <li><a href="#">Mis Proyectos</a></li>
                    <li><a href="#">Configuración</a></li>
                    <li><a href="#">Mensajes</a></li>
                    <li><a href="#">Estadísticas</a></li>
                    <li><a href="#" id="logoutBtn">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="welcome-message">
                <div class="user-info">
                    <img src="../images/profile.jpg" alt="Avatar" class="user-avatar">
                    <div>
                        <h2 id="welcomeUser">Bienvenido, Usuario</h2>
                        <p>Último acceso: <span id="lastAccess">Hoy</span></p>
                    </div>
                </div>
                <p>Desde aquí puedes gestionar todos los aspectos de tu portafolio profesional.</p>
            </div>
            
            <section class="dashboard-section">
                <h3>Actividad Reciente</h3>
                <p>No hay actividad reciente para mostrar.</p>
            </section>
        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        // Mostrar información del usuario (simulado)
        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (user) {
                document.getElementById('welcomeUser').textContent = `Bienvenido, ${user.name}`;
            } else {
                // Si no hay usuario logueado, redirigir a login
                window.location.href = 'login.html';
            }
            
            // Manejar logout
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('currentUser');
                window.location.href = '../login.html';
            });
        });
    </script>
</body>
</html>
